<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-labelledby="did-title did-desc">
  <title id="did-title">Defense in Depth: Nine-Layer Security Architecture</title>
  <desc id="did-desc">Concentric rings representing nine defensive layers from outer governance to inner incident response. Each layer labeled with key controls. Threat-specific annotations show which threats each layer mitigates.</desc>
  <defs>
    <linearGradient id="layer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A"/>
      <stop offset="100%" stop-color="#142d5e"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2a4a7a"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099CC"/>
      <stop offset="100%" stop-color="#0077AA"/>
    </linearGradient>
    <linearGradient id="layer4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077AA"/>
      <stop offset="100%" stop-color="#005588"/>
    </linearGradient>
    <linearGradient id="layer5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005588"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
    <linearGradient id="layer6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#002244"/>
    </linearGradient>
    <linearGradient id="layer7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A"/>
      <stop offset="100%" stop-color="#142d5e"/>
    </linearGradient>
    <linearGradient id="layer8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2a4a7a"/>
    </linearGradient>
    <linearGradient id="layer9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099CC"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <pattern id="subtleDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0099CC" fill-opacity="0.05"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="700" fill="#FAFAFA"/>
  <rect width="700" height="700" fill="url(#subtleDots)"/>
  
  <g transform="translate(350, 350)" font-family="system-ui, -apple-system, sans-serif">
    <!-- Layer 9 (innermost): Incident Response & Recovery -->
    <circle r="55" fill="url(#layer9)" fill-opacity="0.9" filter="url(#ringShadow)"/>
    <text x="0" y="-8" text-anchor="middle" font-size="11" font-weight="600" fill="white" letter-spacing="0.3px">9. INCIDENT RESPONSE</text>
    <text x="0" y="8" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.85)">IR plan, playbooks, tabletop exercises, backup restoration, cyber insurance</text>
    
    <!-- Layer 8: Monitoring & Detection -->
    <circle r="110" fill="none" stroke="url(#layer8)" stroke-width="22" stroke-opacity="0.85" filter="url(#ringShadow)"/>
    <g transform="rotate(-45)">
      <text x="0" y="-82" text-anchor="middle" font-size="10" font-weight="600" fill="#005588">8. MONITORING & DETECTION</text>
      <text x="0" y="-68" text-anchor="middle" font-size="8.5" fill="#0077AA">SIEM, SOAR, UEBA, NDR, threat hunting, intel integration</text>
    </g>
    
    <!-- Layer 7: Data Protection -->
    <circle r="165" fill="none" stroke="url(#layer7)" stroke-width="22" stroke-opacity="0.8" filter="url(#ringShadow)"/>
    <g transform="rotate(45)">
      <text x="0" y="-137" text-anchor="middle" font-size="10" font-weight="600" fill="#0B1D3A">7. DATA PROTECTION</text>
      <text x="0" y="-123" text-anchor="middle" font-size="8.5" fill="#142d5e">Classification, encryption, DLP, backup/immutability, key management</text>
    </g>
    
    <!-- Layer 6: Application Security -->
    <circle r="220" fill="none" stroke="#0099CC" stroke-width="22" stroke-opacity="0.75" filter="url(#ringShadow)"/>
    <g transform="rotate(-45)">
      <text x="0" y="-192" text-anchor="middle" font-size="10" font-weight="600" fill="#005588">6. APPLICATION SECURITY</text>
      <text x="0" y="-178" text-anchor="middle" font-size="8.5" fill="#0077AA">Secure SDLC, SAST/DAST/SCA, WAF, API security, SBOM</text>
    </g>
    
    <!-- Layer 5: Endpoint Security -->
    <circle r="275" fill="none" stroke="#0077AA" stroke-width="22" stroke-opacity="0.7" filter="url(#ringShadow)"/>
    <g transform="rotate(45)">
      <text x="0" y="-247" text-anchor="middle" font-size="10" font-weight="600" fill="#003366">5. ENDPOINT SECURITY</text>
      <text x="0" y="-233" text-anchor="middle" font-size="8.5" fill="#005588">EDR/XDR, app control, disk encryption, automated patching</text>
    </g>
    
    <!-- Layer 4: Network Security -->
    <circle r="330" fill="none" stroke="#005588" stroke-width="22" stroke-opacity="0.65" filter="url(#ringShadow)"/>
    <g transform="rotate(-45)">
      <text x="0" y="-302" text-anchor="middle" font-size="10" font-weight="600" fill="#002244">4. NETWORK SECURITY</text>
      <text x="0" y="-288" text-anchor="middle" font-size="8.5" fill="#003366">Segmentation, microsegmentation, ZTNA, DNS filtering, encrypted DNS</text>
    </g>
    
    <!-- Layer 3: User Awareness & Training -->
    <circle r="385" fill="none" stroke="#0099CC" stroke-width="22" stroke-opacity="0.6" filter="url(#ringShadow)"/>
    <g transform="rotate(45)">
      <text x="0" y="-357" text-anchor="middle" font-size="10" font-weight="600" fill="#005588">3. USER AWARENESS & TRAINING</text>
      <text x="0" y="-343" text-anchor="middle" font-size="8.5" fill="#0077AA">Phishing simulation, deepfake training, security culture, reporting</text>
    </g>
    
    <!-- Layer 2: Identity & Access Security -->
    <circle r="440" fill="none" stroke="#0077AA" stroke-width="22" stroke-opacity="0.55" filter="url(#ringShadow)"/>
    <g transform="rotate(-45)">
      <text x="0" y="-412" text-anchor="middle" font-size="10" font-weight="600" fill="#003366">2. IDENTITY & ACCESS SECURITY</text>
      <text x="0" y="-398" text-anchor="middle" font-size="8.5" fill="#005588">Phishing-resistant MFA (FIDO2), PAM, IGA, Zero Trust identity</text>
    </g>
    
    <!-- Layer 1 (outermost): Governance & Security Policies -->
    <circle r="495" fill="none" stroke="#005588" stroke-width="22" stroke-opacity="0.5" filter="url(#ringShadow)"/>
    <g transform="rotate(45)">
      <text x="0" y="-467" text-anchor="middle" font-size="10" font-weight="600" fill="#002244">1. GOVERNANCE & SECURITY POLICIES</text>
      <text x="0" y="-453" text-anchor="middle" font-size="8.5" fill="#003366">Risk management framework, policies, compliance, board oversight</text>
    </g>
    
    <!-- Threat annotation lines pointing to relevant layers -->
    <g stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.7">
      <!-- AI Phishing -> Layer 2, 3 -->
      <path d="M 280,-280 Q 320,-240 350,-180" stroke-width="1.5"/>
      <text x="360" y="-175" font-size="9" fill="#EF4444" font-weight="500">AI Phishing</text>
      
      <!-- RaaS -> Layer 5, 7 -->
      <path d="M -320,180 Q -280,140 -220,80" stroke-width="1.5"/>
      <text x="-340" y="70" font-size="9" fill="#EF4444" font-weight="500">RaaS</text>
      
      <!-- Cloud -> Layer 1, 6, 7 -->
      <path d="M 180,380 Q 140,340 80,280" stroke-width="1.5"/>
      <text x="60" y="270" font-size="9" fill="#EF4444" font-weight="500">Cloud Config</text>
      
      <!-- IoT -> Layer 4 -->
      <path d="M -280,-280 Q -240,-240 -180,-180" stroke-width="1.5"/>
      <text x="-300" y="-170" font-size="9" fill="#EF4444" font-weight="500">IoT</text>
      
      <!-- Zero-Day -> Layer 4, 6, 8 -->
      <path d="M 380,80 Q 340,40 280,0" stroke-width="1.5"/>
      <text x="380" y="-15" font-size="9" fill="#EF4444" font-weight="500">Zero-Day</text>
    </g>
    
    <!-- Layer numbers on outer edge -->
    <g font-size="14" font-weight="700" fill="#0B1D3A" opacity="0.4">
      <text x="0" y="-495" text-anchor="middle">1</text>
      <text x="0" y="-440" text-anchor="middle">2</text>
      <text x="0" y="-385" text-anchor="middle">3</text>
      <text x="0" y="-330" text-anchor="middle">4</text>
      <text x="0" y="-275" text-anchor="middle">5</text>
      <text x="0" y="-220" text-anchor="middle">6</text>
      <text x="0" y="-165" text-anchor="middle">7</text>
      <text x="0" y="-110" text-anchor="middle">8</text>
      <text x="0" y="-55" text-anchor="middle">9</text>
    </g>
    
    <!-- Direction arrows -->
    <g fill="#0099CC">
      <path d="M 0,-515 L -8,-500 L 8,-500 Z" transform="rotate(0)"/>
      <path d="M 0,-515 L -8,-500 L 8,-500 Z" transform="rotate(45)"/>
      <path d="M 0,-515 L -8,-500 L 8,-500 Z" transform="rotate(90)"/>
      <path d="M 0,-515 L -8,-500 L 8,-500 Z" transform="rotate(135)"/>
      <path d="M 0,-515 L -8,-500 L 8,-500 Z" transform="rotate(180)"/>
      <path d="M 0,-515 L -8,-500 L 8,-500 Z" transform="rotate(225)"/>
      <path d="M 0,-515 L -8,-500 L 8,-500 Z" transform="rotate(270)"/>
      <path d="M 0,-515 L -8,-500 L 8,-500 Z" transform="rotate(315)"/>
    </g>
    
    <text x="0" y="-535" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">Outer → Inner: Increasing proximity to critical assets</text>
  </g>
  
  <!-- Title -->
  <text x="0" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#0B1D3A">Defense in Depth: Nine-Layer Architecture</text>
  <text x="0" y="328" text-anchor="middle" font-size="10" fill="#6B7280">Each layer reduces likelihood and impact. Failure of one layer is mitigated by the next. Annotations show primary threat coverage.</text>
</svg>