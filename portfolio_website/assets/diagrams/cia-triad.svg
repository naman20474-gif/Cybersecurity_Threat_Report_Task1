<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" role="img" aria-labelledby="cia-title cia-desc">
  <title id="cia-title">CIA Triad: Confidentiality, Integrity, Availability</title>
  <desc id="cia-desc">Three overlapping circles representing the three core principles of information security. Confidentiality (blue), Integrity (green), and Availability (orange) overlap at the center showing their interdependence.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="confGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0B1D3A"/>
    </linearGradient>
    <linearGradient id="integGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="availGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099CC"/>
      <stop offset="100%" stop-color="#0077AA"/>
    </linearGradient>
  </defs>
  
  <!-- Background subtle grid -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.5"/>
    </pattern>
    <rect width="600" height="520" fill="url(#grid)"/>
  </g>
  
  <!-- Circle: Confidentiality (top-left) -->
  <circle cx="180" cy="180" r="140" fill="url(#confGrad)" fill-opacity="0.85" filter="url(#softShadow)" stroke="#0099CC" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Circle: Integrity (top-right) -->
  <circle cx="420" cy="180" r="140" fill="url(#integGrad)" fill-opacity="0.85" filter="url(#softShadow)" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Circle: Availability (bottom-center) -->
  <circle cx="300" cy="360" r="140" fill="url(#availGrad)" fill-opacity="0.85" filter="url(#softShadow)" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Center overlap highlight -->
  <ellipse cx="300" cy="240" rx="55" ry="45" fill="url(#centerGrad)" fill-opacity="0.25"/>
  
  <!-- Labels -->
  <g font-family="system-ui, -apple-system, sans-serif" fill="#0B1D3A">
    <!-- Confidentiality -->
    <text x="180" y="130" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="0.5px" fill="#0B1D3A">CONFIDENTIALITY</text>
    <text x="180" y="154" text-anchor="middle" font-size="11" fill="#4B5563" line-height="1.4">
      <tspan x="180" dy="0">Encryption, access controls,</tspan>
      <tspan x="180" dy="14">classification, DLP</tspan>
    </text>
    
    <!-- Integrity -->
    <text x="420" y="130" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="0.5px" fill="#0B1D3A">INTEGRITY</text>
    <text x="420" y="154" text-anchor="middle" font-size="11" fill="#4B5563">
      <tspan x="420" dy="0">Hashing, digital signatures,</tspan>
      <tspan x="420" dy="14">version control, change detection</tspan>
    </text>
    
    <!-- Availability -->
    <text x="300" y="310" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="0.5px" fill="#0B1D3A">AVAILABILITY</text>
    <text x="300" y="334" text-anchor="middle" font-size="11" fill="#4B5563">
      <tspan x="300" dy="0">Redundancy, disaster recovery,</tspan>
      <tspan x="300" dy="14">DDoS protection, capacity planning</tspan>
    </text>
    
    <!-- Center label -->
    <text x="300" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#006699" letter-spacing="0.3px">INTERDEPENDENCE</text>
    <text x="300" y="258" text-anchor="middle" font-size="9" fill="#6B7280">Balanced, risk-informed approach</text>
  </g>
  
  <!-- Connector lines between labels and circles -->
  <g stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3" opacity="0.5">
    <line x1="180" y1="168" x2="180" y2="180"/>
    <line x1="420" y1="168" x2="420" y2="180"/>
    <line x1="300" y1="348" x2="300" y2="360"/>
  </g>
</svg>